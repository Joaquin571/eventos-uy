<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Alta Patrocinio - eventos.uy</title>

    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/guard.js" data-roles="organizador"></script>
</head>

<body>

<header id="headerPrincipal"></header>
<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Alta de Patrocinio</h1>
                    <form id="formAltaPatrocinio">
                        <div class="mb-3">
                            <label for="evento" class="form-label">Evento</label>
                            <select class="form-select" id="evento" name="evento" required>
                                <option value="">Seleccione un evento</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="edicion" class="form-label">Edición</label>
                            <select class="form-select" id="edicion" name="edicion" required>
                                <option value="">Seleccione una edición</option>
                            </select>

                        </div>
                        <div class="mb-3">
                            <label for="institucion" class="form-label">Institución</label>
                            <select class="form-select" id="institucion" name="institucion" required>
                                <option value="">Seleccione una institución</option>
                            </select>

                        </div>
                        <div class="mb-3">
                            <label for="nivel" class="form-label">Nivel de patrocinio</label>
                            <select class="form-select" id="nivel" name="nivel" required>
                                <option value="">Seleccione un nivel de patrocinio</option>
                                <option value="Platino">Platino</option>
                                <option value="Oro">Oro</option>
                                <option value="Plata">Plata</option>
                                <option value="Bronce">Bronce</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="tipoRegistro" class="form-label">Tipo de Registro</label>
                            <select class="form-select" id="tipoRegistro" name="tipoRegistro" required>
                                <option value="">Seleccione un tipo de registro</option>
                            </select>

                        </div>
                        <div class="mb-3">
                            <label for="aporte" class="form-label">Aporte económico</label>
                            <input type="number" class="form-control" id="aporte" name="aporte" placeholder="Indique el aporte" min="0" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label for="registrograt" class="form-label">Cantidad de registros gratuitos</label>
                            <input type="number" class="form-control" id="registrograt" name="registrograt" placeholder="Indique la cantidad" min="0" step="1" required>
                        </div>

                        <div class="mb-4">
                            <label for="codigo" class="form-label">Código de patrocinio</label>
                            <input type="text" class="form-control" id="codigo" name="codigo" placeholder="Ingrese el código" required>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="../index.html" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Dar de alta</button>
                        </div>
                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../js/datos.js"></script>
<script src="../js/selects.js"></script>
<script src="../js/patrocinio.js"></script>
<script src="../js/login.js"></script>
<script src="../js/header.js"></script>

</body>

</html>
