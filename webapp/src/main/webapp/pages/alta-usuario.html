<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - eventos.uy</title>

    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">

    <style>
        .header-bg-custom { background-color: #0b4f7c !important; }
        .btn-registro-green {
            background-color: #198754 !important;
            border-color: #198754 !important;
            color: #ffffff !important;
            font-weight: 600;
        }
        .btn-login-header {
            background-color: #ffffff !important;
            color: #0b4f7c !important;
            border: 1px solid #ffffff !important;
            font-weight: 600 !important;
        }
        .invalid-feedback-custom {
            display: block !important;
            color: #dc3545 !important;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 4px;
        }
    </style>
</head>

<body class="bg-light">

<header id="headerPrincipal"></header>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-4 p-md-5">

                    <h2 class="h3 fw-bold mb-4 text-dark">Registro de Usuario</h2>

                    <form id="formAltaUsuario" novalidate>

                        <div class="mb-3">
                            <label for="tipoRol" class="form-label fw-bold">Tipo de Usuario</label>
                            <select id="tipoRol" class="form-select fs-6">
                                <option value="asistente" selected>Asistente</option>
                                <option value="organizador">Organizador</option>
                            </select>
                        </div>

                        <!-- Nickname y Correo -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="nickname" class="form-label fw-bold">Nickname *</label>
                                <input type="text" id="nickname" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="correo" class="form-label fw-bold">Correo *</label>
                                <input type="email" id="correo" class="form-control">
                            </div>
                        </div>

                        <!-- Nombre y Apellido -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label fw-bold">Nombre *</label>
                                <input type="text" id="nombre" class="form-control">
                            </div>
                            <div class="col-md-6" id="bloqueApellido">
                                <label for="apellido" class="form-label fw-bold">Apellido *</label>
                                <input type="text" id="apellido" class="form-control">
                            </div>
                        </div>

                        <!-- Contraseñas para que sean visibles -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="p1" class="form-label fw-bold">Contraseña *</label>
                                <div class="input-group">
                                    <input type="password" id="p1" class="form-control">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassVisibility('p1', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="p2" class="form-label fw-bold">Confirmar Contraseña *</label>
                                <div class="input-group">
                                    <input type="password" id="p2" class="form-control">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassVisibility('p2', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Imagen -->
                        <div class="mb-3">
                            <label for="imagenPerfil" class="form-label fw-bold">Imagen de Perfil (Opcional)</label>
                            <input type="file" id="imagenPerfil" class="form-control" accept="image/*">
                        </div>

                        <!-- Campos de Asistente -->
                        <div id="camposAsistente">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="fechaNac" class="form-label fw-bold">Fecha de Nacimiento *</label>
                                    <input type="date" id="fechaNac" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label for="institucion" class="form-label fw-bold">Institución (Opcional)</label>
                                    <select id="institucion" class="form-select">
                                        <option value="">Ninguna</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Campos de Organizador -->
                        <div id="camposOrganizador" class="d-none">
                            <div class="mb-3">
                                <label for="descripcion" class="form-label fw-bold">Descripción General *</label>
                                <textarea id="descripcion" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="sitioWeb" class="form-label fw-bold">Sitio Web (Opcional)</label>
                                <input type="url" id="sitioWeb" class="form-control" placeholder="https://ejemplo.com">
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-registro-green w-100 py-2 fs-5 rounded-2">
                                Registrarse
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../js/datos.js"></script>
<script src="../js/usuario.js"></script>
<script src="../js/login.js"></script>
<script src="../js/header.js"></script>
</body>

</html>
