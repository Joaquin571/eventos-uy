<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro a Edición de Evento - eventos.uy</title>

    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-light">

<header class="bg-primary shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark container py-2">
        <a class="navbar-brand fw-bold fs-4" href="../index.html">eventos.uy</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link text-white" href="../index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="usuarios.html">Usuarios</a>
                </li>
            </ul>

            <div id="accionesUsuario" class="d-flex align-items-center gap-2">
                <a class="btn btn-outline-light" href="login.html">Iniciar sesión</a>
                <a class="btn btn-light text-primary fw-bold" href="alta-usuario.html">Registrarse</a>
            </div>
        </div>
    </nav>
</header>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Registro a Edición de Evento</h1>

                    <div id="mensajeAcceso" class="alert d-none"></div>

                    <form id="formRegistroEdicion" class="d-none">

                        <div class="mb-3">
                            <label for="evento" class="form-label">Evento</label>
                            <select class="form-select" id="evento" name="evento" required>
                                <option value="">Seleccione un evento</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="edicion" class="form-label">Edición</label>
                            <select class="form-select" id="edicion" name="edicion" disabled required>
                                <option value="">Seleccione una edición</option>
                            </select>
                        </div>

                        <div id="detalleEdicion" class="d-none">

                            <div class="alert alert-light border">
                                <div><strong>Sigla:</strong> <span id="siglaEdicion"></span></div>
                                <div><strong>Ciudad:</strong> <span id="ciudadEdicion"></span></div>
                                <div><strong>País:</strong> <span id="paisEdicion"></span></div>
                                <div><strong>Inicio:</strong> <span id="inicioEdicion"></span></div>
                                <div><strong>Fin:</strong> <span id="finEdicion"></span></div>
                            </div>

                        </div>

                        <div class="mb-3">
                            <label for="tipoRegistro" class="form-label">Tipo de registro</label>
                            <select class="form-select" id="tipoRegistro" name="tipoRegistro" disabled required>
                                <option value="">Seleccione un tipo de registro</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-block">Modalidad de registro</label>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="modalidad"
                                       id="modalidadGeneral" value="general" checked>
                                <label class="form-check-label" for="modalidadGeneral">General</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="modalidad"
                                       id="modalidadCodigo" value="codigo">
                                <label class="form-check-label" for="modalidadCodigo">Con código de patrocinio</label>
                            </div>
                        </div>

                        <div class="mb-4 d-none" id="contenedorCodigo">
                            <label for="codigo" class="form-label">Código de patrocinio</label>
                            <input type="text" class="form-control" id="codigo" name="codigo" placeholder="Ingrese el código">
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="../index.html" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Registrarme</button>
                        </div>

                    </form>
                </div>

            </div>

        </div>

    </div>

</main>

<script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../js/datos.js"></script>
<script src="../js/selects.js"></script>
<script src="../js/login.js"></script>
<script src="../js/registro.js"></script>

</body>

</html>
