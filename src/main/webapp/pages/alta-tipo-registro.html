<!doctype html>
<html lang="es"><head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alta de tipo de registro | eventos.uy</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-root="..">
<div id="site-header"></div>
<main class="container">
    <h1>Alta de tipo de registro</h1>
    <form class="form" data-demo>
        <div class="field">
            <label for="edicion">Edición</label>

            <select id="edicion" name="edicion" required>
                <option value="">Seleccione una edición</option>
                <option value="Maratón 2026">Maratón 2026</option>
                <option value="Maratón 2025">Maratón 2025</option>
                <option value="Maratón 2024">Maratón 2024</option>
            </select>
        </div>
        <div class="field">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="field">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" required></textarea>
        </div>

        <div class="field">
            <label for="costo">Costo</label>
            <input type="number" id="costo" name="costo" min="0" required>
        </div>

        <div class="field">
            <label for="cupo">Cupo</label>
            <input type="number" id="cupo" name="cupo" min="1" required>
        </div>
        <div class="message"></div>

        <button class="btn btn-primary" type="submit">Confirmar</button>
        <button class="btn" type="reset">Cancelar</button>
    </form>
</main>
<script src="../js/datos.js"></script><script src="../js/app.js"></script></body></html>
