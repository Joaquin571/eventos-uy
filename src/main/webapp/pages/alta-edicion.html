
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de edición | eventos.uy</title>

    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/guard.js" data-roles="organizador"></script>
</head>

<body data-root="..">

<header id="headerPrincipal"></header>

<main class="container py-4">

    <h1 class="mb-4">Alta de edición de evento</h1>

    <div class="card">
        <div class="card-body">

            <form id="formAltaEdicion">

                <div class="mb-3">
                    <label for="evento" class="form-label">Evento</label>
                    <select id="evento" name="evento"
                            class="form-select" required>
                        <option value="">Seleccione un evento</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre de la edición
                    </label>
                    <input type="text" id="nombre" name="nombre"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="sigla" class="form-label">Sigla</label>
                    <input type="text" id="sigla" name="sigla"
                           class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="ciudad" class="form-label">Ciudad</label>
                        <input type="text" id="ciudad" name="ciudad"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="pais" class="form-label">País</label>
                        <input type="text" id="pais" name="pais"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="fechaInicio" class="form-label">
                            Fecha de inicio
                        </label>
                        <input type="date" id="fechaInicio"
                               name="fechaInicio" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="fechaFin" class="form-label">
                            Fecha de finalización
                        </label>
                        <input type="date" id="fechaFin"
                               name="fechaFin" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="imagen" class="form-label">
                        Imagen (opcional)
                    </label>
                    <input type="file" id="imagen" name="imagen"
                           class="form-control" accept="image/*">

                    <img id="vistaImagen"
                         class="img-fluid rounded mt-3 d-none"
                         alt="Vista previa"
                         style="max-height: 220px;">
                </div>

                <div id="mensaje" class="alert d-none" role="alert"></div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Confirmar
                    </button>

                    <button type="reset" class="btn btn-secondary">
                        Limpiar
                    </button>

                    <a href="../index.html" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>

<script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../js/datos.js"></script>
<script src="../js/app.js"></script>
<script src="../js/login.js"></script>
<script src="../js/header.js"></script>
<script src="../js/edicion.js"></script>


</body>
</html>
