<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consulta Patrocinio - eventos.uy</title>
    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-primary navbar-dark">

            <div class="container">

                <a class="navbar-brand fw-bold"
                   href="../index.html">
                    eventos.uy
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarPrincipal"
                        aria-controls="navbarPrincipal"
                        aria-expanded="false"
                        aria-label="Abrir navegación">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse"
                     id="navbarPrincipal">

                    <ul class="navbar-nav me-auto">

                        <li class="nav-item">
                            <a class="nav-link"
                               href="../index.html">
                                Eventos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active"
                               href="consulta-patrocinio.html">
                                Consulta Patrocinio
                            </a>
                        </li>

                    </ul>

                    <span class="navbar-text text-white">
                        Visitante, Asistente, Organizador
                    </span>

                </div>

            </div>

        </nav>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm">

                    <div class="card-body p-4">
                        <h1 class="h3 mb-4">Consulta de Patrocinio</h1>
                        <div class="mb-3">
                            <label for="evento" class="form-label">Evento</label>
                            <select class="form-select" id="evento" name="evento" required>
                                <option value="">Seleccione un evento</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="edicion" class="form-label">Edición</label>
                            <select class="form-select" id="edicion" name="edicion" disabled>
                                <option value="">Seleccione una edición</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="patrocinio" class="form-label">Patrocinio</label>
                            <select class="form-select" id="patrocinio" name="patrocinio" disabled>
                                <option value="">Seleccione un patrocinio</option>
                            </select>
                        </div>
                        <div id="detallePatrocinio" class="d-none">

                            <hr class="my-4">

                            <h2 class="h5 mb-3">Detalle del patrocinio</h2>
                            <div class="mb-3">
                                <strong>Institución:</strong>
                                <span id="institucion"></span>
                            </div>

                            <div class="mb-3">
                                <strong>Nivel:</strong>
                                <span id="nivel"></span>
                            </div>

                            <div class="mb-3">
                                <strong>Aporte:</strong>
                                <span id="aporte"></span>
                            </div>

                            <div class="mb-3">
                                <strong>Tipo de registro:</strong>
                                <span id="tipoRegistro"></span>
                            </div>

                            <div class="mb-3">
                                <strong>Cantidad de registros gratuitos:</strong>
                                <span id="registrograt"></span>
                            </div>

                            <div class="mb-3">
                                <strong>Fecha de alta:</strong>
                                <span id="fechaalta"></span>
                            </div>

                            <div class="mb-3" id="contenedorCodigo">
                                <strong>Código de patrocinio:</strong>
                                <span id="codigo"></span>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="../index.html" class="btn btn-primary">Aceptar</a>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>
    <script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/selects.js"></script>
    <script src="../js/patrocinio.js"></script>
</body>
</html>
